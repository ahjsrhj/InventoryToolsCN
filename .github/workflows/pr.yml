name: Update plugin repository

# Updates pluginmaster.json in ahjsrhj/DalamudPlugins so Dalamud users receive the new
# version. It is dispatched by release.yml after the GitHub Release for the tag exists,
# because the download link points at that Release. It does not run on tag pushes
# directly, which would race the release.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (e.g. v15.0.13)'
        required: true

env:
  INTERNAL_NAME: InventoryTools
  PLUGIN_NAME: Allagan Tools
  PLUGIN_REPO: ahjsrhj/DalamudPlugins
  PLUGIN_REPO_DIR: external

jobs:
  update-repo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Extract version and changelog
        id: changelog
        run: |
          VERSION=$(grep -m1 -oP '(?<=## \[)[0-9]+\.[0-9]+\.[0-9]+' ${{ env.INTERNAL_NAME }}/CHANGELOG.md)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          CHANGELOG=$(awk -v ver=$VERSION '/^#+ \[/ { if (p) { exit }; if ($2 == "["ver"]") { p=1; next} } p && NF' ${{ env.INTERNAL_NAME }}/CHANGELOG.md)
          echo "log<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Checkout plugin repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PLUGIN_REPO }}
          fetch-depth: '1'
          path: ${{ env.PLUGIN_REPO_DIR }}
          token: ${{ secrets.PLUGIN_REPO_PAT }}

      - name: Configure git author
        run: |
          cd ${{ env.PLUGIN_REPO_DIR }}
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"

      - name: Update pluginmaster.json
        env:
          INTERNAL_NAME: ${{ env.INTERNAL_NAME }}
          PLUGIN_REPO_DIR: ${{ env.PLUGIN_REPO_DIR }}
          VERSION: ${{ steps.changelog.outputs.version }}
          CHANGELOG_TEXT: ${{ steps.changelog.outputs.log }}
          TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'EOF'
          import json, os, sys, time
          from pathlib import Path

          path = Path(os.environ["PLUGIN_REPO_DIR"]) / "pluginmaster.json"
          entries = json.loads(path.read_text(encoding="utf-8"))

          url = f"https://github.com/ahjsrhj/InventoryToolsCN/releases/download/{os.environ['TAG']}/latest.zip"

          found = False
          for entry in entries:
              if entry.get("InternalName") != os.environ["INTERNAL_NAME"]:
                  continue
              found = True
              entry["AssemblyVersion"] = os.environ["VERSION"]
              entry["DownloadLinkInstall"] = url
              entry["DownloadLinkTesting"] = url
              entry["DownloadLinkUpdate"] = url
              entry["Changelog"] = os.environ["CHANGELOG_TEXT"].strip()
              entry["LastUpdate"] = int(time.time())

          if not found:
              sys.exit(f"Entry {os.environ['INTERNAL_NAME']} not found in pluginmaster.json")

          path.write_text(json.dumps(entries, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          EOF

      - name: Commit and push
        env:
          VERSION: ${{ steps.changelog.outputs.version }}
          PLUGIN_NAME: ${{ env.PLUGIN_NAME }}
        run: |
          cd ${{ env.PLUGIN_REPO_DIR }}
          git add pluginmaster.json
          if git diff --cached --quiet; then
            echo "pluginmaster.json unchanged, nothing to push"
            exit 0
          fi
          git commit -m "${PLUGIN_NAME} ${VERSION}"
          git push origin HEAD:main
