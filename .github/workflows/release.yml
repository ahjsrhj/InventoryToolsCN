name: Release

# Runs when a version tag (e.g. v15.0.13) is pushed. Builds the plugin from the tagged
# commit, creates the GitHub Release with latest.zip, then dispatches pr.yml to update
# pluginmaster.json in the plugin repository.
#
# Pushes to main do not trigger a release. Run Tests is a separate workflow and does not
# gate this one.

on:
  push:
    tags:
      - 'v*'

env:
  INTERNAL_NAME: InventoryTools
  CONFIGURATION: Release
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  PLUGIN_WORKFLOW: pr.yml

jobs:
  build:
    name: Build plugin from tag
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v1.1.3
      - name: Download Dalamud
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile latest.zip
          Expand-Archive -Force latest.zip "$env:AppData\XIVLauncher\addon\Hooks\dev\"
      - name: Restore
        run: dotnet restore ${{ env.INTERNAL_NAME }}
      - name: Build
        run: dotnet build -c ${{ env.CONFIGURATION }} --no-restore ${{ env.INTERNAL_NAME }}
      - name: Verify latest.zip
        shell: pwsh
        run: |
          $zip = "InventoryTools\bin\Release\InventoryTools\latest.zip"
          if (-not (Test-Path $zip)) { throw "latest.zip was not produced at $zip" }
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            InventoryTools\bin\Release\InventoryTools\latest.zip

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout the tagged commit
        uses: actions/checkout@v4

      - name: Extract version and changelog
        id: changelog
        run: |
          VERSION=$(grep -m1 -oP '(?<=## \[)[0-9]+\.[0-9]+\.[0-9]+' ${{ env.INTERNAL_NAME }}/CHANGELOG.md)
          if [ "v$VERSION" != "${{ github.ref_name }}" ]; then
            echo "::error::Tag ${{ github.ref_name }} does not match CHANGELOG version $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          awk -v ver=$VERSION '/^#+ \[/ { if (p) { exit }; if ($2 == "["ver"]") { p=1; next} } p && NF' ${{ env.INTERNAL_NAME }}/CHANGELOG.md > release-notes.md

      - name: Check whether the release already exists
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Release $TAG already exists, skipping."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Download build artifact
        if: steps.existing.outputs.exists == 'false'
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Create release
        if: steps.existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          test -f dist/latest.zip || { echo "latest.zip missing from dist artifact"; ls -la dist; exit 1; }
          # The tag already exists (it triggered this run), so no --target is needed.
          gh release create "$TAG" dist/latest.zip \
            --repo "${{ github.repository }}" \
            --title "$TAG" \
            --notes-file release-notes.md

      - name: Trigger plugin repository update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # Tags pushed with GITHUB_TOKEN do not trigger other workflows, so dispatch pr.yml explicitly.
          # This runs after the release exists, so pr.yml never sees a missing download link.
          gh workflow run ${{ env.PLUGIN_WORKFLOW }} \
            --repo "${{ github.repository }}" \
            --ref "$TAG" \
            -f tag="$TAG"
